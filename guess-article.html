<html lang="en">

    <title>Visual German - Tug of War</title>

    <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#FFF8F6",
            "surface-container": "#fbeae7",
            "surface-container-low": "#FDF1EE",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#221a18",
            "on-surface-variant": "#56423d",
            "primary": "#7d2b15",
            "on-primary": "#ffffff",
            "primary-fixed": "#ffdbd2",
            "on-primary-fixed": "#3c0800",
            "gender-der": "#1D64B4",
            "gender-der-container": "#D2E4FF",
            "gender-die": "#B3264D",
            "gender-die-container": "#FFD9E1",
            "gender-das": "#8A5100",
            "gender-das-container": "#FFDDB8",
            "streak-orange": "#F97316",
            "error-red": "#EF4444",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "success-green": "#22C55E",
            "tertiary": "#692a7c",
            "tertiary-fixed": "#fbd7ff"
          },
          fontFamily: {
            sans: ["Roboto Flex", "sans-serif"]
          }
        }
      }
    };

    <style>
        body { overscroll-behavior: none; background-color: #FFF8F6; }
        ::-webkit-scrollbar { display: none; }
        .star-slot {
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: #f1e5e2;
            border: 1px dashed #dcc1ba;
            transition: all 0.3s ease;
        }
        .star-slot.filled.user {
            background: #1D64B4;
            border: 1px solid #1D64B4;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(29, 100, 180, 0.5);
        }
        .star-slot.filled.opponent {
            background: #B3264D;
            border: 1px solid #B3264D;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(179, 38, 77, 0.5);
        }
        #confettiCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }
    </style>
</head>

<body class="bg-surface font-sans text-on-surface flex flex-col min-h-screen antialiased">

<!-- TOP HEADER -->
<header class="fixed top-0 w-full z-40 bg-surface/90 backdrop-blur-xl shadow-sm">
    <div class="h-16 px-4 max-w-[480px] mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a href="guess-lib.html" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="font-bold text-lg text-on-surface">Tug of War</h1>
        </div>
        
        <!-- Timer Display -->
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-streak-orange border border-streak-orange/30">
            <span class="material-symbols-outlined text-[18px]">timer</span>
            <span class="font-bold text-sm tabular-nums" id="timerDisplay">04:00</span>
        </div>
    </div>
</header>

<!-- MAIN GAME CONTAINER -->
<main class="flex flex-col relative w-full pt-16 bg-surface min-h-screen max-w-[480px] mx-auto pb-6 px-4 select-none gap-4">

    <!-- GAME OVER OVERLAY (Victory / Defeat) -->
    <div id="gameOverOverlay" class="hidden absolute inset-0 bg-on-surface/80 backdrop-blur-md z-50 rounded-3xl flex-col items-center justify-center p-6 text-center">
        <canvas id="confettiCanvas"></canvas>
        <h1 id="overlayTitle" class="text-3xl font-black text-streak-orange mb-2">Game Over</h1>
        <p id="overlayMessage" class="text-white text-lg mb-2 font-medium"></p>
        <p id="overlayScore" class="text-gray-300 text-sm mb-6 font-semibold"></p>
        <div class="flex gap-3 z-50">
            <button onclick="location.reload()" class="px-6 py-3 rounded-full bg-streak-orange text-white font-bold shadow-lg active:scale-95 transition-transform">Play Again 🔄</button>
            <a href="index.html" class="px-6 py-3 rounded-full bg-white/20 text-white font-bold shadow-lg active:scale-95 transition-transform">Hub 🏠</a>
        </div>
    </div>

    <!-- STAR SHELVES ARENA -->
    <section class="flex flex-col gap-3 bg-surface-container-low p-4 rounded-2xl shadow-sm border border-outline-variant/30 mt-2">
        <!-- USER SHELF -->
        <div>
            <div class="flex justify-between items-center text-xs font-bold text-gender-der mb-1.5 px-1">
                <span>USER SHELF (YOU)</span>
                <span id="userScoreText">12 / 24</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5 bg-white/60 p-2 rounded-xl" id="userShelf"></div>
        </div>

        <!-- OPPONENT SHELF -->
        <div>
            <div class="flex justify-between items-center text-xs font-bold text-gender-die mb-1.5 px-1">
                <span>BOT SHELF (OPPONENT)</span>
                <span id="opponentScoreText">12 / 24</span>
            </div>
            <div class="grid grid-cols-6 gap-1.5 bg-white/60 p-2 rounded-xl" id="opponentShelf"></div>
        </div>
    </section>

    <!-- CENTRAL GERMAN WORD DRILL PODIUM (MD3 Elevated Card) -->
    <section class="bg-surface-container-lowest rounded-2xl p-6 shadow-md flex flex-col items-center text-center gap-2 border border-outline-variant/20">
        <div class="px-3 py-1 rounded-full bg-surface-container text-on-surface-variant text-xs font-semibold">
            Nouns Practice • A1-A2
        </div>
        
        <!-- Target German Word -->
        <h2 class="text-4xl font-black text-on-surface tracking-tight mt-2" id="currentWord">
            Loading...
        </h2>
        
        <!-- English Translation Hint -->
        <p class="text-sm font-medium italic text-on-surface-variant mb-2" id="currentTranslation">
            (...)
        </p>

        <p class="text-xs text-on-surface-variant/80">Select the correct article to pull stars!</p>
    </section>

    <!-- TACTILE 3-WAY ARTICLE TRIO BUTTONS (DER / DIE / DAS) -->
    <section class="grid grid-cols-3 gap-3 w-full">
        <!-- DER Button -->
        <button class="flex flex-col items-center justify-between p-3.5 rounded-2xl bg-gender-der text-white shadow-md active:scale-95 transition-transform min-h-[96px]" onclick="checkAnswer('der')">
            <span class="text-[10px] uppercase font-bold opacity-80">Maskulin</span>
            <span class="text-2xl font-black tracking-wide">DER</span>
            <span class="text-[11px] opacity-75 font-medium">der Tisch</span>
        </button>

        <!-- DIE Button -->
        <button class="flex flex-col items-center justify-between p-3.5 rounded-2xl bg-gender-die text-white shadow-md active:scale-95 transition-transform min-h-[96px]" onclick="checkAnswer('die')">
            <span class="text-[10px] uppercase font-bold opacity-80">Feminin</span>
            <span class="text-2xl font-black tracking-wide">DIE</span>
            <span class="text-[11px] opacity-75 font-medium">die Lampe</span>
        </button>

        <!-- DAS Button -->
        <button class="flex flex-col items-center justify-between p-3.5 rounded-2xl bg-gender-das text-white shadow-md active:scale-95 transition-transform min-h-[96px]" onclick="checkAnswer('das')">
            <span class="text-[10px] uppercase font-bold opacity-80">Neutrum</span>
            <span class="text-2xl font-black tracking-wide">DAS</span>
            <span class="text-[11px] opacity-75 font-medium">das Auto</span>
        </button>
    </section>

    <div class="text-center text-xs text-on-surface-variant/60 italic mt-auto">
        Tug-of-War • Visual German Arcade
    </div>
</main>

<script>
    let userStars = 12;
    let opponentStars = 12;
    let timerSeconds = 240;
    let timerInterval = null;
    let currentWordObj = null;
    let userStreak = 0;
    let wordBank = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initGame() {
        renderShelves();
        
        fetch('./data/articles.json')
            .then(res => {
                if(!res.ok) throw new Error("Could not load articles.json");
                return res.json();
            })
            .then(data => {
                wordBank = data;
                shuffleArray(wordBank);
                startTimer();
                nextWord();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('currentWord').innerText = "Error loading words!";
            });
    }

    function renderShelves() {
        const userShelfEl = document.getElementById('userShelf');
        const opponentShelfEl = document.getElementById('opponentShelf');
        userShelfEl.innerHTML = '';
        opponentShelfEl.innerHTML = '';

        for(let i=0; i<24; i++) {
            const slot = document.createElement('div');
            slot.className = `star-slot ${i < userStars ? 'filled user' : ''}`;
            slot.innerText = i < userStars ? '★' : '';
            userShelfEl.appendChild(slot);
        }

        for(let i=0; i<24; i++) {
            const slot = document.createElement('div');
            slot.className = `star-slot ${i < opponentStars ? 'filled opponent' : ''}`;
            slot.innerText = i < opponentStars ? '★' : '';
            opponentShelfEl.appendChild(slot);
        }

        document.getElementById('userScoreText').innerText = `${userStars} / 24`;
        document.getElementById('opponentScoreText').innerText = `${opponentStars} / 24`;

        if(userStars >= 24 || opponentStars <= 0) endGame(true, "Knockout! You won all stars! 🎉");
        if(opponentStars >= 24 || userStars <= 0) endGame(false, "You lost all your stars! ❌");
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timerSeconds--;
            let mins = Math.floor(timerSeconds / 60);
            let secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if(timerSeconds <= 0) {
                clearInterval(timerInterval);
                if(userStars > opponentStars) endGame(true, "Time's up! You won on points! 🏆");
                else endGame(false, "Time's up! Opponent won! 😞");
            }
        }, 1000);
    }

    function nextWord() {
        if(wordBank.length === 0) return;

        let pool = wordBank;
        if(userStreak >= 2) {
            const hardPool = wordBank.filter(w => w.difficulty === 'hard');
            if(hardPool.length > 0) pool = hardPool;
        }
        
        const randomIndex = Math.floor(Math.random() * pool.length);
        currentWordObj = pool[randomIndex];
        document.getElementById('currentWord').innerText = currentWordObj.word;
        document.getElementById('currentTranslation').innerText = currentWordObj.en ? `(${currentWordObj.en})` : '';
    }

    function checkAnswer(selectedArticle) {
        if(!currentWordObj) return;

        if(selectedArticle === currentWordObj.article) {
            userStars++;
            opponentStars--;
            userStreak++;
        } else {
            userStars--;
            opponentStars++;
            userStreak = 0;
        }
        renderShelves();
        nextWord();
    }

    // Confetti Engine
    function launchConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const particles = [];
        const colors = ['#f59e0b', '#3b82f6', '#ef4444', '#10b981', '#ec4899'];

        for (let i = 0; i < 60; i++) {
            particles.push({
                x: canvas.width / 2, y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 8,
                size: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                gravity: 0.15, alpha: 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = false;
            particles.forEach(p => {
                if (p.alpha > 0) {
                    activeParticles = true;
                    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.012;
                    ctx.globalAlpha = Math.max(p.alpha, 0);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            if (activeParticles) requestAnimationFrame(animate);
        }
        animate();
    }

    // Rain Engine for Defeat
    function launchRain() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const drops = [];
        for (let i = 0; i < 40; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                length: Math.random() * 15 + 10,
                speed: Math.random() * 8 + 6,
                color: 'rgba(148, 163, 184, 0.6)'
            });
        }

        let startTime = Date.now();
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drops.forEach(d => {
                ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y + d.length);
                ctx.strokeStyle = d.color; ctx.lineWidth = 1.5; ctx.stroke();
                d.y += d.speed;
                if (d.y > canvas.height) { d.y = -d.length; d.x = Math.random() * canvas.width; }
            });
            if (Date.now() - startTime < 3500) requestAnimationFrame(animate);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        animate();
    }

    function endGame(isWin, message) {
        clearInterval(timerInterval);
        const overlay = document.getElementById('gameOverOverlay');
        document.getElementById('overlayTitle').innerText = isWin ? "Victory! 🎉" : "Defeat ❌";
        document.getElementById('overlayMessage').innerText = message;
        document.getElementById('overlayScore').innerText = `Final Score — You: ${userStars} ★ | Bot: ${opponentStars} ★`;
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');

        if (isWin) {
            let burstCount = 0;
            setTimeout(launchConfetti, 100);
            const burstInterval = setInterval(() => {
                burstCount++;
                if (burstCount < 3) launchConfetti();
                else clearInterval(burstInterval);
            }, 600);
        } else {
            setTimeout(launchRain, 100);
        }
    }

    window.onload = initGame;
</script>
</body>
</html>

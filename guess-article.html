<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZS6B48F50R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZS6B48F50R');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c2c2c">
    <title>Guess the Article - Tug of War</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timer-badge {
            background: #222;
            border: 1px solid var(--pastel-orange);
            color: var(--pastel-orange);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .shelf-title {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
        }

        .star-shelf {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }

        .star-slot {
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #2a2a2a;
            border: 1px dashed #444;
            transition: all 0.3s ease;
        }

        .star-slot.filled.user {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            text-shadow: 0 0 8px #3b82f6;
        }

        .star-slot.filled.opponent {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            text-shadow: 0 0 8px #ef4444;
        }

        .word-card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 20px 15px;
            margin: 15px 0;
            border: 2px solid var(--pastel-orange);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        .target-word {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .word-translation {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            font-style: italic;
        }

        .article-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-article {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-article:active { transform: scale(0.95); }

        .btn-der { background: #2563eb; }
        .btn-die { background: #dc2626; }
        .btn-das { background: #16a34a; }

        .game-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            border-radius: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .overlay-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-container" style="position: relative;">
    <!-- Overlay for Win/Lose -->
    <div class="game-overlay" id="gameOverOverlay">
        <canvas id="confettiCanvas"></canvas>
        <h1 id="overlayTitle" style="color: var(--pastel-orange); margin-bottom: 10px;">Game Over</h1>
        <p id="overlayMessage" style="color: var(--text-white); margin-bottom: 10px; font-size: 1.1rem;"></p>
        <p id="overlayScore" style="color: var(--text-gray); margin-bottom: 20px; font-weight: 600;"></p>
        <div class="overlay-btns">
            <button onclick="location.reload()" class="start-btn-badge" style="padding: 12px 20px; font-size: 0.9rem; cursor: pointer;">Play Again 🔄</button>
            <a href="index.html" class="start-btn-badge" style="padding: 12px 20px; font-size: 0.9rem; cursor: pointer; background: #444; text-decoration: none;">Hub 🏠</a>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="guess-lib.html" class="back-link" style="margin: 0;">← Back</a>
        <div class="timer-badge" id="timerDisplay">T.Time 04:00</div>
    </div>

    <!-- User Shelf -->
    <div class="shelf-title">
        <span>USER SHELF</span>
        <span id="userScoreText">12 / 24</span>
    </div>
    <div class="star-shelf" id="userShelf"></div>

    <!-- Gameplay Zone -->
    <div class="word-card">
        <div class="target-word" id="currentWord">Loading...</div>
        <div class="word-translation" id="currentTranslation">...</div>
        <div class="article-buttons">
            <button class="btn-article btn-der" onclick="checkAnswer('der')">der</button>
            <button class="btn-article btn-die" onclick="checkAnswer('die')">die</button>
            <button class="btn-article btn-das" onclick="checkAnswer('das')">das</button>
        </div>
    </div>

    <!-- Opponent Shelf -->
    <div class="shelf-title">
        <span>OPPONENT SHELF</span>
        <span id="opponentScoreText">12 / 24</span>
    </div>
    <div class="star-shelf" id="opponentShelf"></div>

    <div class="stealth-footer">Tug-of-War • Visual German</div>
</div>

<script>
    let userStars = 12;
    let opponentStars = 12;
    let timerSeconds = 240;
    let timerInterval = null;
    let currentWordObj = null;
    let userStreak = 0;
    let wordBank = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initGame() {
        renderShelves();
        
        fetch('./data/articles.json')
            .then(res => {
                if(!res.ok) throw new Error("Could not load articles.json");
                return res.json();
            })
            .then(data => {
                wordBank = data;
                shuffleArray(wordBank);
                startTimer();
                nextWord();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('currentWord').innerText = "Error loading words!";
            });
    }

    function renderShelves() {
        const userShelfEl = document.getElementById('userShelf');
        const opponentShelfEl = document.getElementById('opponentShelf');
        userShelfEl.innerHTML = '';
        opponentShelfEl.innerHTML = '';

        for(let i=0; i<24; i++) {
            const slot = document.createElement('div');
            slot.className = `star-slot ${i < userStars ? 'filled user' : ''}`;
            slot.innerText = i < userStars ? '★' : '';
            userShelfEl.appendChild(slot);
        }

        for(let i=0; i<24; i++) {
            const slot = document.createElement('div');
            slot.className = `star-slot ${i < opponentStars ? 'filled opponent' : ''}`;
            slot.innerText = i < opponentStars ? '★' : '';
            opponentShelfEl.appendChild(slot);
        }

        document.getElementById('userScoreText').innerText = `${userStars} / 24`;
        document.getElementById('opponentScoreText').innerText = `${opponentStars} / 24`;

        if(userStars >= 24 || opponentStars <= 0) endGame(true, "Knockout! You won all stars! 🎉");
        if(opponentStars >= 24 || userStars <= 0) endGame(false, "You lost all your stars! ❌");
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timerSeconds--;
            let mins = Math.floor(timerSeconds / 60);
            let secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `T.Time ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if(timerSeconds <= 0) {
                clearInterval(timerInterval);
                if(userStars > opponentStars) endGame(true, "Time's up! You won on points! 🏆");
                else endGame(false, "Time's up! Opponent won! 😞");
            }
        }, 1000);
    }

    function nextWord() {
        if(wordBank.length === 0) return;

        let pool = wordBank;
        if(userStreak >= 2) {
            const hardPool = wordBank.filter(w => w.difficulty === 'hard');
            if(hardPool.length > 0) pool = hardPool;
        }
        
        const randomIndex = Math.floor(Math.random() * pool.length);
        currentWordObj = pool[randomIndex];
        document.getElementById('currentWord').innerText = currentWordObj.word;
        document.getElementById('currentTranslation').innerText = currentWordObj.en ? `(${currentWordObj.en})` : '';
    }

    function checkAnswer(selectedArticle) {
        if(!currentWordObj) return;

        if(selectedArticle === currentWordObj.article) {
            userStars++;
            opponentStars--;
            userStreak++;
        } else {
            userStars--;
            opponentStars++;
            userStreak = 0;
        }
        renderShelves();
        nextWord();
    }

    function launchConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const particles = [];
        const colors = ['#f59e0b', '#3b82f6', '#ef4444', '#10b981', '#ec4899'];

        for (let i = 0; i < 60; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 3,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.8) * 8,
                size: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                gravity: 0.15,
                alpha: 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = false;

            particles.forEach(p => {
                if (p.alpha > 0) {
                    activeParticles = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.alpha -= 0.012;

                    ctx.globalAlpha = Math.max(p.alpha, 0);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (activeParticles) {
                requestAnimationFrame(animate);
            }
        }
        animate();
    }

    function endGame(isWin, message) {
        clearInterval(timerInterval);
        const overlay = document.getElementById('gameOverOverlay');
        document.getElementById('overlayTitle').innerText = isWin ? "Victory! 🎉" : "Defeat ❌";
        document.getElementById('overlayMessage').innerText = message;
        document.getElementById('overlayScore').innerText = `Final Score — You: ${userStars} ★ | Bot: ${opponentStars} ★`;
        overlay.style.display = 'flex';

        // მოგების შემთხვევაში ვრთავთ 3-ჯერად სროლას!
        if (isWin) {
            let burstCount = 0;
            const maxBursts = 3; // 3 გასროლა
            
            // პირველი გასროლა მყისიერად
            setTimeout(launchConfetti, 100);
            
            // მომდევნო გასროლები ინტერვალით
            const burstInterval = setInterval(() => {
                burstCount++;
                if (burstCount < maxBursts) {
                    launchConfetti();
                } else {
                    clearInterval(burstInterval);
                }
            }, 600); // ყოველ 0.6 წამში ერთხელ გაისვრის თავიდან
        }
    }

    window.onload = initGame;
</script>
</body>
</html>

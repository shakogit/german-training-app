<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZS6B48F50R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZS6B48F50R');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual German - Interactive Practice</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <h1>🇩🇪 Visual German</h1>
      <p>Master German grammar interactively</p>
    </div>
  </header>

  <main class="main-container">
    <section class="welcome-section">
      <h2>Select a Topic</h2>
      <p>Choose a topic below to start practicing:</p>
    </section>

    <!-- Dynamic Topic Cards Container -->
    <div id="topics-grid" class="topics-grid">
      <div class="loading-spinner">Loading topics...</div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Register Service Worker for PWA support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered:', reg.scope))
          .catch(err => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
